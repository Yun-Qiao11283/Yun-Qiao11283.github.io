# Projects in display order. Links are optional.
- title: "Quasi-Newton Methods for Large-Scale PDE-Constrained Optimization"
  dates: "January 2026 – Present"
  institution: "The Ohio State University"
  role: "Research Assistant · Department of Mathematics"
  supervisor: "Prof. Anna Yesypenko"
  summary: |-
    I investigate quasi-Newton methods for large-scale PDE-constrained optimization within a variational framework. My work also studies randomized sketching approaches to reduce computational cost while preserving numerical accuracy.
