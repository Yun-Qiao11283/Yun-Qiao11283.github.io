- title: "LLMAdBench: A Human Preference Benchmark for Advertising in LLM Responses"
  dates: "May 2026 – Present"
  institution: "The University of Texas at Dallas"
  role: "Research Contributor"
  supervisor: "Prof. Chonghuan Wang, Naveen Jindal School of Management"
  summary: |-
    I contributed to a benchmark examining how advertisement placement and sponsorship disclosure affect human preferences for LLM-generated responses. My contributions include pairwise preference annotation across six dimensions covering user experience, advertiser value, and overall preference.

    I helped construct a benchmark containing **18,576 dimension-level human judgments** from **258 source conversations**, spanning four advertisement placements and two disclosure conditions.
  methods: "Pairwise Preference Annotation · Benchmark Dataset Construction"

- title: "Topological Data Analysis (TDA) for Equity Markets"
  dates: "September 2025 – May 2026"
  institution: "The Ohio State University"
  advisor_label: "Research Mentor"
  supervisor: "Luči Krnić, Ph.D. Candidate"
  summary: |-
    I investigated relationships among financial assets using a retrospective Python pipeline combining Ward hierarchical clustering, return normality tests, and PCA visualization.

    Using correlation-based distances, I computed rolling-window Vietoris-Rips persistent homology and extracted separate H₀ and H₁ persistence landscape L₁ amplitudes to summarize changes in asset topology over time. Outputs included topology time series, persistence diagrams, and statistical visualizations for retrospective analysis of financial market structure.
  methods: "Persistent Homology · Persistence Landscapes · Hierarchical Clustering · PCA · Rolling-Window Analysis · Python"
  github: "https://github.com/Yun-Qiao11283/TDA"
  poster: "https://github.com/Yun-Qiao11283/TDA/blob/HEAD/poster/TDA.pdf"
